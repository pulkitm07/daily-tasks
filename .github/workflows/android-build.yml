name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --no-package-lock

    - name: Build Web Assets
      run: |
        mkdir -p www
        cp index.html manifest.json sw.js www/
        cp -r icons www/icons || true
        npx esbuild native.js --bundle --outfile=www/native.bundle.js

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make gradlew executable and fix line endings
      run: |
        sed -i 's/\r$//' android/gradlew
        chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: day-planner-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
